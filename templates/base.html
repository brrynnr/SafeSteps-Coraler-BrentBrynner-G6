<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SafeSteps</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary px-3">
  <a class="navbar-brand" href="/">SafeSteps</a>
  <div class="d-flex gap-2 align-items-center">
  {% if user.is_authenticated %}
    <span class="text-white">{{ user.full_name }} ({{ user.get_account_type_display }})</span>
    <a class="btn btn-light btn-sm" href="{% url 'accounts:dashboard' %}">Dashboard</a>
    <a class="btn btn-light btn-sm" href="{% url 'accounts:profile' %}">Profile</a>
    <form method="post" action="{% url 'accounts:logout' %}" class="m-0">{% csrf_token %}
      <button class="btn btn-outline-light btn-sm">Logout</button>
    </form>
  {% else %}
    <a class="btn btn-light btn-sm" href="{% url 'accounts:login' %}">Login</a>
    <a class="btn btn-outline-light btn-sm" href="{% url 'accounts:register' %}">Register</a>
  {% endif %}
  </div>
</nav>
<div class="container mt-4" style="max-width:640px">
  {% for m in messages %}
    <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %}">{{ m }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
