{% extends "base.html" %}
{% block content %}
<h2>{{ action }}?</h2>
<p>Are you sure you want to {{ action|lower }} <strong>{{ obj }}</strong>?</p>
<form method="post">{% csrf_token %}
  <button class="btn btn-danger">Yes, {{ action|lower }}</button>
  <a class="btn btn-secondary" href="javascript:history.back()">Cancel</a>
</form>
{% endblock %}
